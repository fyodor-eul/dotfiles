# Minimal Hyprland config that immediately launches hyprlock
exec-once = hyprlock --immediate

# After hyprlock exits (successful auth), launch normal session
exec-once = bash -c 'while pgrep hyprlock > /dev/null; do sleep 1; done; exec Hyprland -c ~/.config/hypr/hyprland.conf'

# Basic Hyprland settings for the greeter
monitor = , preferred, auto, 1

#input {
#    kb_layout = us
#    follow_mouse = 1
#    touchpad {
#        natural_scroll = no
#    }
#    sensitivity = 0
#}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        #natural_scroll = false
        natural_scroll = true
    }
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    layout = dwindle
}

# Disable most interactions during lock screen
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
